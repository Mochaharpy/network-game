<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Host</title>
    <style>
      body {
        width: 100%;
        height: 100vh;
        margin: 0;
        overflow-y: hidden;
      }
      #qrcode {
        margin-left: 16px;
        width: fit-content;
        align-items: center;
        display: flex;
        flex-direction: column;
      }
      #player-list {
        list-style: none;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background-color: #121212;
          color: #ffffff;
        }
        #game-local-qrcode {
          filter: invert();
        }
      }

      #game-list {
        list-style: none;
      }

      .game-icon {
        max-width: 100px;
        max-height: 150px;
      }
    </style>
  </head>
  <body>
    <figure id="qrcode">
      <img id="game-local-qrcode" src="/src/assets/gamelocal.svg" />
      <figcaption>http://game.local/controller</figcaption>
    </figure>
    <ul id="player-list">
      <template id="player-card-template">
        <li class="player-card"></li>
      </template>
    </ul>
    <button popovertarget="game-list">Games</button>
    <ul id="game-list" popover>
      <template id="game-card-template">
        <li class="game-card">
          <span class="game-name"></span>
          <ul class="game-card-list">
            <img class="game-icon"></img>
            <li class="game-description"></li>
          </ul>
        </li>
      </template>
    </ul>
    <script type="module" src="/src/host/scripts/host.ts"></script>
  </body>
</html>
