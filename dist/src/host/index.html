<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Host</title>
    <style>body{width:100%;height:100vh;margin:0;overflow-y:hidden}#qrcode{flex-direction:column;align-items:center;width:fit-content;margin-left:16px;display:flex}#player-list{list-style:none}@media (prefers-color-scheme:dark){body{color:#fff;background-color:#121212}#game-local-qrcode{filter:invert()}}#game-list{list-style:none}.game-icon{max-width:100px;max-height:150px}</style>
    <script type="module" crossorigin src="/assets/host-cA-2i_qp.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/esm-CeQk3Dfx.js">
  </head>
  <body>
    <figure id="qrcode">
      <img id="game-local-qrcode" src="/assets/gamelocal-CIFAiIai.svg" />
      <figcaption>http://game.local/controller</figcaption>
    </figure>
    <ul id="player-list">
      <template id="player-card-template">
        <li class="player-card"></li>
      </template>
    </ul>
    <button popovertarget="game-list">Games</button>
    <ul id="game-list" popover>
      <template id="game-card-template">
        <li class="game-card">
          <span class="game-name"></span>
          <ul class="game-card-list">
            <img class="game-icon"></img>
            <li class="game-description"></li>
          </ul>
        </li>
      </template>
    </ul>
  </body>
